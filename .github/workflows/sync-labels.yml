name: Sync labels

# Applies .github/labels.yml to the repository, so the labels the automation
# depends on exist without anybody creating them by hand. The merge gate in
# auto-merge.yml reads the `automated` label, so a missing label would stop the
# daily loop from ever merging.
#
# This creates a label that is missing and updates one whose colour or
# description drifted. It never deletes a label.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Apply .github/labels.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            // Parse the label file. It is a flat list of `- name:` blocks with
            // `color:` and `description:` fields, so a small parser avoids
            // pulling a YAML dependency into the workflow.
            const wanted = [];
            for (const raw of fs.readFileSync('.github/labels.yml', 'utf8').split('\n')) {
              const line = raw.replace(/\s+$/, '');
              if (!line || line.trimStart().startsWith('#')) continue;
              const field = (key) => {
                const m = line.match(new RegExp(`^\\s*-?\\s*${key}:\\s*(.*)$`));
                if (!m) return null;
                return m[1].trim().replace(/^["'](.*)["']$/, '$1');
              };
              const name = line.startsWith('- name:') ? field('name') : null;
              if (name !== null) { wanted.push({ name, color: '', description: '' }); continue; }
              if (wanted.length === 0) continue;
              const color = field('color');
              if (color !== null) { wanted[wanted.length - 1].color = color.replace(/^#/, ''); continue; }
              const description = field('description');
              if (description !== null) wanted[wanted.length - 1].description = description;
            }

            if (wanted.length === 0) {
              core.setFailed('Parsed no labels from .github/labels.yml.');
              return;
            }

            const existing = new Map(
              (await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner, repo, per_page: 100,
              })).map((l) => [l.name.toLowerCase(), l]),
            );

            let created = 0, updated = 0;
            for (const label of wanted) {
              const current = existing.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`created: ${label.name}`);
                created++;
                continue;
              }
              const drifted =
                current.color.toLowerCase() !== label.color.toLowerCase() ||
                (current.description ?? '') !== label.description;
              if (drifted) {
                await github.rest.issues.updateLabel({
                  owner, repo, name: current.name,
                  new_name: label.name, color: label.color, description: label.description,
                });
                core.info(`updated: ${label.name}`);
                updated++;
              }
            }

            core.notice(
              `Labels in sync: ${wanted.length} declared, ${created} created, ${updated} updated.`,
            );
